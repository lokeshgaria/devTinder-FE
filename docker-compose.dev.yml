version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app                  # syncs your local code → container
      - /app/node_modules       # protects container node_modules
    env_file:
      - .env                    # loads your .env file automatically
    environment:
      - NODE_ENV=development